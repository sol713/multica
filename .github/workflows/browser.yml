name: Octop Browser bridge
on:
  pull_request:
    paths:
      - 'server/internal/daemon/browser*'
      - '.github/workflows/browser.yml'
  workflow_dispatch:
jobs:
  bridge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r server/internal/daemon/browser-requirements.txt
      - run: python -m unittest discover -s server/internal/daemon -p browser_sidecar_test.py -v
